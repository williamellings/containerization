services:
  web:
    image: ${DOCKERHUB_USER}/todo-web:latest
    build: ./web
    ports:
      - "80:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - front
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USER}/todo-api:latest
    build: ./api
    # Inga publicerade portar och inget container_name, så den kan skalas: --scale api=3
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - front
      - back
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    user: postgres # kör inte som root
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - back
    restart: unless-stopped

networks:
  front:
  back:
    internal: true # db når inte internet, och web är inte med här, så web når inte db

volumes:
  pgdata:
