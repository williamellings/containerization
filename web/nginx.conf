server {
    listen 8080;

    # Dockers inbyggda DNS. Gör att nginx hittar nya api-instanser vid --scale
    resolver 127.0.0.11 valid=5s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        # Variabel tvingar nginx att slå upp "api" på nytt (round-robin över instanser)
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
}
